server:
  port: 10803

spring:
  application:
    name: edd-sgw
  main:
    web-application-type: reactive
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,sgwSnapshot

sgw:
  runtime:
    direct-upstream-hosts: ${SGW_DIRECT_UPSTREAM_HOSTS:}
    trusted-proxy-cidrs: ${SGW_TRUSTED_PROXY_CIDRS:}
    discovery-service-name: edd-sgw
  publication:
    pointer-store: ${SGW_POINTER_STORE:nacos}
    data-id: ${SGW_POINTER_DATA_ID:edd-sgw-config-version}
    group: ${SGW_POINTER_GROUP:DEFAULT_GROUP}
    deadline-seconds: ${SGW_PUBLICATION_DEADLINE_SECONDS:60}
    timeout-sweep-interval-millis: 5000
  security:
    ciam:
      issuer: ${SGW_CIAM_ISSUER:https://account.openiov.top}
      jwks-uri: ${SGW_CIAM_JWKS_URI:lb://sec-ciam/api/open/oidc/v1/jwks}
    internal:
      clients:
        mpt: ${SGW_INTERNAL_SECRET:}

logging:
  level:
    net.hwyz.iov.cloud.edd.sgw: INFO
